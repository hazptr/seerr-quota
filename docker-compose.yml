services:
  seerr-quota:
    image: ghcr.io/hazptr/seerr-quota:latest
    container_name: seerr-quota
    # The container runs as a non-root uid (below) and needs write access to
    # the SQLite db directory. Before first start:
    #   mkdir -p data/db && sudo chown 1000:1000 data/db
    # (substitute your own PUID/PGID if you override the defaults below).
    user: "${PUID:-1000}:${PGID:-1000}"   # match the UID/GID that owns ./data/db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8101:3000"             # loopback only; put a reverse proxy in front (see wiki/Deployment.md)
    volumes:
      - ./data/db:/db
      - /path/to/media:/mnt/media:ro
      # Legacy `db` playback source ONLY (JELLYFIN_PLAYBACK_SOURCE=db) — not
      # needed with the default `rest` source. This would be Jellyfin's own
      # live WAL-mode SQLite DB; opening it read-only from a `:ro` single-file
      # bind mount fails in WAL mode ("attempt to write a readonly
      # database"), so this mount is incompatible with `:ro` unless your
      # Jellyfin data dir is otherwise writable to this container.
      # - /path/to/jellyfin/data/data/jellyfin.db:/jellyfin-db/jellyfin.db:ro
    mem_limit: 512m
    healthcheck:
      # node:22-slim ships no wget/curl; using Node's built-in `fetch`
      # (stable since Node 18) avoids adding an apt package to the runner
      # image just for this (see app/Dockerfile's runner-stage comment).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - proxy

networks:
  proxy:
    external: true
